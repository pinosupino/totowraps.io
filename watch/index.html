<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFDD0"><title>TotoWrap · Watch</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="watch.css"></head><body><main id="watch"><header><img src="../imgs/totoswrap.png" alt="TotoWrap"></header><div class="watch-actions"><button id="theme-toggle" type="button" aria-label="Switch color theme">☾ DARK</button><button id="login-toggle" type="button">LOGIN</button></div><div class="status"><span id="connection" aria-live="polite">CONNECTING</span></div><nav aria-label="Watch pages"><button class="active" data-tab="today" aria-label="Today">TODAY</button><button data-tab="bets">BETS</button><button data-tab="board">BOARD</button></nav><section id="content" aria-live="polite"><p class="empty">Loading live game…</p></section><section id="login-panel" hidden><form id="login-form"><label for="admin-email">ADMIN EMAIL</label><input id="admin-email" type="email" autocomplete="username" required><label for="admin-password">PASSWORD</label><input id="admin-password" type="password" autocomplete="current-password" required><button type="submit">SIGN IN</button></form><p id="auth-message" role="status"></p></section><section id="wrap-panel" hidden><button id="logout" type="button">LOG OUT</button></section><dialog id="wrap-dialog" aria-labelledby="wrap-dialog-title"><div class="dialog-inner"><h2 id="wrap-dialog-title">Official Wrap</h2><p id="wrap-confirm-time"></p><p class="dialog-hint">Confirm the official wrap time?</p><button id="wrap-confirm" type="button">CONFIRM WRAP</button><button id="wrap-cancel" type="button">CANCEL</button><p id="wrap-error" role="alert"></p></div></dialog></main><script type="module" src="watch.js"></script></body></html>
